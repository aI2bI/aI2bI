<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1E7B4F">
</head>
<body>
<!--ARTIFACT-START-->
<title>Snap Snack</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: phone-first single column app; on wide screens a two-column board (label + meals left, charts right). Fixed bottom action bar with the Snap button. */
:root{
  --bg:#F3F6F2; --surface:#FFFFFF; --surface-2:#EAF0EA; --ink:#14211A; --muted:#5B6B62; --line:#DCE3DC;
  --accent:#1E7B4F; --accent-soft:#D9EEE2; --on-accent:#FFFFFF;
  --snap:#FF5A36; --on-snap:#FFFFFF;
  --protein:#2F6FE4; --carbs:#D88F12; --fat:#D2416E; --fiber:#5E8A1F; --water:#2A93C2;
  --good:#1E8E55; --warn:#B87C00; --bad:#CF3B3B;
  --shadow:0 1px 2px rgba(20,33,26,.06),0 6px 24px rgba(20,33,26,.06);
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Helvetica Neue",Arial,system-ui,sans-serif;
  --f-data:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1512; --surface:#16201B; --surface-2:#1C2822; --ink:#E7EFEA; --muted:#93A39A; --line:#26332C;
  --accent:#4CC38A; --accent-soft:#1D3A2B; --on-accent:#08130D;
  --snap:#FF6B4A; --on-snap:#1A0A05;
  --protein:#6A9CFF; --carbs:#F2B544; --fat:#F06A92; --fiber:#9CCB52; --water:#5BC3EA;
  --good:#4CC38A; --warn:#F2B544; --bad:#FF6B6B;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1512; --surface:#16201B; --surface-2:#1C2822; --ink:#E7EFEA; --muted:#93A39A; --line:#26332C;
  --accent:#4CC38A; --accent-soft:#1D3A2B; --on-accent:#08130D;
  --snap:#FF6B4A; --on-snap:#1A0A05;
  --protein:#6A9CFF; --carbs:#F2B544; --fat:#F06A92; --fiber:#9CCB52; --water:#5BC3EA;
  --good:#4CC38A; --warn:#F2B544; --bad:#FF6B6B;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(220px + env(safe-area-inset-bottom,0px));-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
/* Arrow everywhere; the thin text cursor only where you type (it was nearly invisible on the dark theme) */
body{cursor:default} input,textarea,select{cursor:text} select,input[type=checkbox],input[type=time]{cursor:pointer} a{cursor:pointer}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
.num,.tab{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-data)}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.wrap{max-width:1120px;margin:0 auto}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:12px 8px;display:flex;flex-direction:column;gap:10px}
.brandrow{display:flex;align-items:center;gap:12px;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--snap);display:grid;place-items:center;color:var(--on-snap)}
.brand h1{font-size:22px;font-weight:800}
.brand small{display:block;color:var(--muted);font-size:12px;font-family:var(--f-body);font-weight:500;letter-spacing:.02em}
.aistatus{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--good)} .dot.off{background:var(--warn)}
.tabs{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:12px;overflow-x:auto}
.tabs button{flex:1;border:0;background:transparent;padding:8px 10px;border-radius:9px;font-weight:600;color:var(--muted);white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* grid */
.board{display:grid;gap:16px;grid-template-columns:1fr;margin-top:6px}
@media (min-width:900px){.board.two{grid-template-columns:minmax(0,420px) minmax(0,1fr);align-items:start}}
@media (max-width:899px){.board.two{display:flex;flex-direction:column}.board.two > .col{display:contents}.first-mobile{order:-1}.daynav{order:-2}}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card h2{font-size:17px;font-weight:700}
.card .sub{color:var(--muted);font-size:13px}
.cardhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700}

/* day nav */
.daynav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.daynav .d{font-family:var(--f-display);font-weight:700;font-size:18px}
.iconbtn{border:1px solid var(--line);background:var(--surface);width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none}
.iconbtn:disabled{opacity:.35;cursor:default}
.chipbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.chipbtn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chipbtn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}

/* nutrition label */
.label{background:var(--surface);border:2px solid var(--ink);border-radius:6px;padding:10px 12px 12px;font-family:var(--f-body)}
.label .lt{font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1;letter-spacing:-.02em}
.label .rule{height:9px;background:var(--ink);margin:6px 0}
.label .rule.m{height:4px} .label .rule.t{height:1px}
.label .calrow{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.label .calrow .k{font-family:var(--f-display);font-weight:800;font-size:22px}
.label .calrow .v{font-family:var(--f-display);font-weight:800;font-size:44px;line-height:.9}
.label .calrow .of{font-size:13px;color:var(--muted);text-align:right}
.label .row{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:5px 0;border-top:1px solid var(--line)}
.label .row b{font-weight:700}
.label .row .dv{font-weight:700;min-width:48px;text-align:right}
.label .row.indent{padding-left:14px}
.bar{grid-column:1/-1;height:6px;border-radius:99px;background:var(--surface-2);position:relative;overflow:visible}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:99px;max-width:100%}
.bar .over{position:absolute;right:0;top:-3px;bottom:-3px;width:3px;border-radius:2px;background:var(--bad)}
.ringwrap{display:flex;gap:14px;align-items:center}
.ring{flex:none}
.remain{display:flex;flex-direction:column;gap:2px}
.remain .big{font-family:var(--f-display);font-weight:800;font-size:28px;line-height:1}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.pill.good{color:var(--good);background:color-mix(in srgb,var(--good) 14%,transparent)}
.pill.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 16%,transparent)}
.pill.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}
.macrochips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.mchip{border-radius:10px;padding:8px 10px;background:var(--surface-2)}
.mchip .n{font-family:var(--f-display);font-weight:800;font-size:20px}
.mchip .l{font-size:12px;color:var(--muted);font-weight:600}
.mchip .t{font-size:11px;color:var(--muted)}
.sw{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:0}

/* insights */
.insights{display:flex;flex-direction:column;gap:8px}
.ins{display:flex;gap:10px;align-items:flex-start;font-size:14px;padding:10px 12px;border-radius:10px;background:var(--surface-2)}
.ins .mk{width:6px;align-self:stretch;border-radius:3px;background:var(--accent);flex:none}
.ins.warn .mk{background:var(--warn)} .ins.bad .mk{background:var(--bad)} .ins.good .mk{background:var(--good)}

/* meals */
.meal{display:flex;flex-direction:column;gap:8px}
.mealhead{display:flex;flex-wrap:wrap;gap:2px 10px;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:4px;margin-top:6px}
.mealhead h3{font-size:15px;font-weight:700}
.mealhead .k{font-family:var(--f-data);font-size:13px;color:var(--muted)}
.entry{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;padding:8px;border-radius:12px;border:1px solid var(--line);background:var(--surface);text-align:left;width:100%}
.entry:hover{border-color:color-mix(in srgb,var(--accent) 50%,var(--line))}
.thumb{width:64px;height:64px;border-radius:9px;object-fit:cover;background:var(--surface-2);display:grid;place-items:center;color:var(--muted);font-size:11px;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.entry .t1{display:flex;justify-content:space-between;gap:8px;font-weight:700}
.entry .t1 .k{font-family:var(--f-data);white-space:nowrap}
.entry .meta{font-size:12px;color:var(--muted)}
.items{list-style:none;margin:4px 0 0;padding:0;display:flex;flex-direction:column;gap:2px;font-size:13px}
.items li{display:flex;justify-content:space-between;gap:8px}
.items li span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.items li .k{font-family:var(--f-data);color:var(--muted);white-space:nowrap}
.mbar{display:flex;height:5px;border-radius:99px;overflow:hidden;margin-top:6px;background:var(--surface-2)}
.mbar i{display:block;height:100%}
.analyzing{position:relative;overflow:hidden}
.analyzing::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,color-mix(in srgb,var(--accent) 14%,transparent) 50%,transparent 70%);animation:sh 1.3s linear infinite}
@keyframes sh{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
@media (prefers-reduced-motion:reduce){.analyzing::after{animation:none}}
.demo-tag{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--warn);border:1px solid currentColor;border-radius:4px;padding:0 4px;margin-left:6px;vertical-align:1px}

/* empty */
.empty{text-align:center;padding:26px 12px;display:flex;flex-direction:column;align-items:center;gap:10px}
.empty h3{font-size:20px}
.empty p{margin:0;color:var(--muted);max-width:36ch}

/* water */
.water{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.glasses{display:flex;gap:4px;flex-wrap:wrap}
.glass{width:18px;height:26px;border:2px solid var(--water);border-top-width:1px;border-radius:2px 2px 6px 6px;background:transparent}
.glass.f{background:var(--water)}

/* charts */
.chartbox{position:relative;height:220px;min-width:0}
.chartbox.tall{height:260px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{padding:10px 12px;border-radius:10px;background:var(--surface-2)}
.stat .v{font-family:var(--f-display);font-weight:800;font-size:22px}
.stat .l{font-size:12px;color:var(--muted);font-weight:600}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:7px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .h{font-size:10px;text-align:center;color:var(--muted);font-weight:700}
.cal .c{aspect-ratio:1;max-width:100%;border-radius:6px;background:var(--surface-2);font-size:11px;display:flex;align-items:flex-start;justify-content:flex-end;padding:3px 4px;color:var(--muted);border:0}
.cal .c.blank{background:transparent}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}

/* forms */
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12px;font-weight:700;color:var(--muted)}
.field input,.field select{border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:8px 10px;width:100%;min-width:0}
.presets{display:flex;gap:6px;flex-wrap:wrap}
.presets button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.note{font-size:13px;color:var(--muted)}
.rowbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}

/* bottom bar */
.dock{position:static;background:transparent;border:0;padding:0}
.dock .in{max-width:1120px;margin:0 auto;display:flex;gap:10px;align-items:center}
.cmd{flex:1;min-width:0;display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 4px 4px 14px}
.cmd input{flex:1;min-width:0;border:0;background:transparent;padding:8px 0;outline:none}
.mic{width:40px;height:40px;border-radius:50%;border:0;background:var(--surface-2);display:grid;place-items:center;flex:none;color:var(--ink)}
.mic.live{background:var(--bad);color:#fff;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px color-mix(in srgb,var(--bad) 25%,transparent)}}
@media (prefers-reduced-motion:reduce){.mic.live{animation:none}}
.snap{flex:none;height:56px;padding:0 22px 0 18px;border-radius:999px;border:0;background:var(--snap);color:var(--on-snap);font-family:var(--f-display);font-weight:800;font-size:18px;display:flex;align-items:center;gap:8px;box-shadow:0 6px 18px color-mix(in srgb,var(--snap) 40%,transparent)}
.snap:active{transform:scale(.97)}
.gal{flex:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
@media (max-width:420px){.snap span{display:none}.snap{padding:0 16px;width:56px;justify-content:center}}
.heard{max-width:1120px;margin:0 auto 6px;font-size:13px;color:var(--muted);min-height:0}

/* toast */
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(16px + env(safe-area-inset-top,0px));z-index:40;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;font-size:14px;display:flex;gap:12px;align-items:center;max-width:min(92vw,520px);box-shadow:var(--shadow)}
.toast button{background:transparent;border:0;color:var(--bg);font-weight:800;text-decoration:underline}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(8,14,11,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
@media (min-width:700px){.scrim{align-items:center}}
.sheet{background:var(--surface);width:min(640px,100%);max-height:80vh;margin-bottom:90px;border-radius:18px!important;overflow:auto;border-radius:18px 18px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
@media (min-width:700px){.sheet{border-radius:18px}}
.sheet .hero{width:100%;max-height:220px;object-fit:cover;border-radius:12px}
.itemedit{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1.3fr) repeat(4,minmax(0,.8fr)) auto;gap:6px;align-items:end}
.itemedit input{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 8px;width:100%;min-width:0}
.itemedit .x{border:0;background:transparent;color:var(--bad);font-size:20px;width:28px}
.ihead{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
@media (max-width:560px){.itemedit{grid-template-columns:repeat(4,minmax(0,1fr)) auto}.itemedit .nm{grid-column:1/-2}.itemedit .pt{grid-column:1/-1;order:2}.ihead{display:none}.itemedit{padding-bottom:8px;border-bottom:1px solid var(--line)}}
.tips{font-size:13px;color:var(--muted);margin:0;padding-left:18px}
/* grades */
.gr{display:inline-flex;align-items:baseline;gap:3px;font-family:var(--f-display);font-weight:800;font-size:13px;line-height:1;padding:4px 7px;border-radius:7px;background:var(--surface-2);color:var(--ink);white-space:nowrap}
.gr small{font-family:var(--f-data);font-weight:500;font-size:10px;opacity:.8}
.gr.big{font-size:22px;padding:6px 10px;border-radius:10px}.gr.big small{font-size:12px}
.gr.good{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.gr.mid{background:color-mix(in srgb,var(--protein) 15%,transparent);color:var(--protein)}
.gr.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.gr.bad{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.thumb .gr{font-size:20px;padding:8px 10px}
.gtxt{font-family:var(--f-display);font-weight:800;font-size:11px}
.gtxt.good{color:var(--good)}.gtxt.mid{color:var(--protein)}.gtxt.warn{color:var(--warn)}.gtxt.bad{color:var(--bad)}
/* coach */
.coach{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 8%,var(--surface)),var(--surface) 60%)}
.coachmsg{margin:0 0 12px;font-family:var(--f-display);font-weight:600;font-size:18px;line-height:1.3;text-wrap:pretty}
.balance{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.bal{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.bal .l{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.bal .v{font-family:var(--f-display);font-weight:800;font-size:22px}
.bal .note{font-size:11px}
@media (max-width:420px){.bal{padding:7px 8px}.bal .v{font-size:17px}.bal .l{font-size:10px;letter-spacing:.02em}}
.plans{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.plan{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface)}
.plan-h{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.plan-h .mono{font-size:12px;color:var(--muted)}
.plan .tips{display:flex;flex-direction:column;gap:3px}
/* gallery timeline */
.timeline{display:flex;flex-direction:column;gap:22px;position:relative;padding-left:22px}
.timeline::before{content:"";position:absolute;left:6px;top:8px;bottom:8px;width:2px;background:var(--line);border-radius:2px}
.tday{position:relative;display:flex;flex-direction:column;gap:10px}
.tdot{position:absolute;left:-21px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:3px solid var(--bg)}
.tday-h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.tday-h h3{font-size:18px}
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
@media (max-width:420px){.ggrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{position:relative;aspect-ratio:1;max-width:100%;border:0;padding:0;border-radius:12px;overflow:hidden;background:var(--surface-2);text-align:left;color:#fff}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.tile .ph{width:100%;height:100%;display:grid;place-items:center;padding:12px;text-align:center;font-family:var(--f-display);font-weight:700;color:var(--ink);background:linear-gradient(135deg,var(--accent-soft),var(--surface-2))}

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
(() => {
"use strict";
/* ============================================================
   SNAP SNACK — single-file app.
   Sections: config · state & storage · AI · food DB · logic ·
   render (today/week/month/targets) · editor · voice/commands.
   Every number on screen is recomputed from S on each change.
   ============================================================ */

/* ---------- config ---------- */
const MACROS = [
  { key:"protein", label:"Protein", unit:"g", kcal:4, color:"--protein" },
  { key:"carbs",   label:"Carbs",   unit:"g", kcal:4, color:"--carbs" },
  { key:"fat",     label:"Fat",     unit:"g", kcal:9, color:"--fat" },
];
const LIMITS = [ // kind: max = stay under, min = reach at least
  { key:"sat_fat", label:"Saturated fat", unit:"g",  kind:"max", parent:"fat" },
  { key:"fiber",   label:"Fiber",         unit:"g",  kind:"min", parent:"carbs" },
  { key:"sugar",   label:"Sugars",        unit:"g",  kind:"max", parent:"carbs" },
  { key:"sodium",  label:"Sodium",        unit:"mg", kind:"max" },
];
const SPLITS = {
  balanced:     { label:"Balanced 25/45/30", p:.25, c:.45, f:.30 },
  high_protein: { label:"High protein 35/35/30", p:.35, c:.35, f:.30 },
  low_carb:     { label:"Low carb 30/25/45", p:.30, c:.25, f:.45 },
  keto:         { label:"Keto 25/5/70", p:.25, c:.05, f:.70 },
  endurance:    { label:"Endurance 20/55/25", p:.20, c:.55, f:.25 },
};
const MEALS = ["Breakfast","Lunch","Snack","Dinner","Late snack"];
const NUTR = ["cal","protein","carbs","fat","sat_fat","fiber","sugar","sodium"];

function targetsFromSplit(cal, split){
  const s = SPLITS[split] || SPLITS.balanced;
  return {
    cal, protein: Math.round(cal*s.p/4), carbs: Math.round(cal*s.c/4), fat: Math.round(cal*s.f/9),
    sat_fat: Math.round(cal*0.10/9), fiber: Math.round(cal/1000*14), sugar: Math.round(cal*0.10/4), sodium: 2300,
  };
}
const DEFAULT_SETTINGS = {
  split:"balanced",
  targets: targetsFromSplit(2200,"balanced"),
  waterGoal: 2500,
  profile:{ name:"", sex:"female", age:35, heightIn:66, weightLb:160, goalWeightLb:"", restingHR:68, activity:"1.55", goal:"lose", units:"us" },
  goalDeficit:500,
  dayStart:"07:00", dayEnd:"21:00",
  model:"claude-sonnet-5-5",
};

/* ---------- helpers ---------- */
const $ = (s, r=document) => r.querySelector(s);
const clone = o => JSON.parse(JSON.stringify(o));
const last = a => a[a.length-1];
const num = v => { const n = parseFloat(String(v ?? "").replace(/[^0-9.\-]/g,"")); return isFinite(n) ? n : 0; };
const r0 = n => Math.round(n||0);
const r1 = n => Math.round((n||0)*10)/10;
const fmt = n => r0(n).toLocaleString();
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const pad = n => String(n).padStart(2,"0");
const dayKey = d => { d = new Date(d); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const parseKey = k => { const [y,m,d] = k.split("-").map(Number); return new Date(y,m-1,d); };
const addDays = (k, n) => { const d = parseKey(k); d.setDate(d.getDate()+n); return dayKey(d); };
const todayKey = () => dayKey(new Date());
const timeStr = ts => new Date(ts).toLocaleTimeString([], { hour:"numeric", minute:"2-digit" });
const cssv = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  if (attrs) for (const [k,v] of Object.entries(attrs)){
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "style") el.style.cssText = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) el.append(c.nodeType ? c : document.createTextNode(String(c)));
  return el;
}
const svgNS = "http://www.w3.org/2000/svg";
function s(tag, attrs){ const el = document.createElementNS(svgNS, tag); for (const [k,v] of Object.entries(attrs||{})) el.setAttribute(k,v); return el; }
function safeGet(k){ try { return localStorage.getItem(k); } catch { return null; } }
function safeSet(k,v){ try { localStorage.setItem(k,v); } catch {} }
function parseJSONLoose(t){
  if (typeof t !== "string") return t;
  try { return JSON.parse(t); } catch {}
  const fence = t.match(/```(?:json)?\s*([\s\S]*?)```/); if (fence) { try { return JSON.parse(fence[1]); } catch {} }
  const a = t.indexOf("{"), b = t.lastIndexOf("}"); if (a>=0 && b>a) { try { return JSON.parse(t.slice(a,b+1)); } catch {} }
  throw new Error("Could not read the AI reply.");
}
function slope(ys){ // least-squares slope per index step, ignoring nulls
  const pts = ys.map((y,i)=>[i,y]).filter(p=>p[1]!=null);
  if (pts.length < 2) return 0;
  const n=pts.length, mx=pts.reduce((a,p)=>a+p[0],0)/n, my=pts.reduce((a,p)=>a+p[1],0)/n;
  let nu=0, de=0; for (const [x,y] of pts){ nu+=(x-mx)*(y-my); de+=(x-mx)**2; }
  return de ? nu/de : 0;
}

/* ---------- state & storage ----------
   S.entries: [{id, ts, day, meal, title, photo, items:[{name,portion,cal,protein,carbs,fat,sat_fat,fiber,sugar,sodium}], demo}]
   S.daily:   { "YYYY-MM-DD": { water:ml, weight:lb } }
   Local mode: localStorage. Claude viewer: private per-user db rows (data/users/<id>/…), synced live across devices. */
const LS_KEY = "snapsnack.v1";
const VIEWS = ["today","gallery","burn","progress","week","month","targets"];
const S = { entries:[], daily:{}, settings:clone(DEFAULT_SETTINGS), view:"today", day:todayKey(), pending:[] };
/* Every record from storage or sync passes through these, so one bad or old-format record can never blank the app. */
const ACT_KEYS = ["rest","think","walk","active","w_light","w_mod","w_full","w_high"];
const DAY_RE = /^\d{4}-\d{2}-\d{2}$/, TIME_RE = /^([01]?\d|2[0-3]):[0-5]\d$/;
const inRange = (v, lo, hi, dflt) => { const n = num(v); return n >= lo && n <= hi ? n : dflt; };
function cleanEntry(e){
  if (!e || typeof e !== "object") return null;
  const t = Number(e.ts), tsOk = isFinite(t) && t > 0;
  const day = typeof e.day === "string" && DAY_RE.test(e.day) ? e.day : tsOk ? dayKey(t) : null;
  if (!day) return null;
  const items = Array.isArray(e.items) ? e.items.filter(i => i && typeof i === "object").map(normItem) : [];
  const out = { id:String(e.id || uid()).slice(0,40), ts: tsOk ? t : parseKey(day).setHours(12), day, items,
    title:String(e.title || "").slice(0,60), meal: MEALS.includes(e.meal) ? e.meal : null,
    photo: typeof e.photo === "string" && e.photo.startsWith("data:image/") ? e.photo : "" };
  if (e.note) out.note = String(e.note).slice(0,200);
  if (e.demo) out.demo = true;
  return out;
}
function cleanEntries(list){ const seen = new Set(); return (Array.isArray(list) ? list : []).map(cleanEntry).filter(e => e && !seen.has(e.id) && seen.add(e.id)); }
function cleanDay(d){
  if (!d || typeof d !== "object") return null;
  const o = {};
  if (num(d.water) > 0) o.water = Math.min(num(d.water), 20000);
  if (num(d.weight) > 0) o.weight = r1(num(d.weight));
  if (Array.isArray(d.activities)) o.activities = d.activities.filter(a => a && ACT_KEYS.includes(a.mode) && num(a.min) > 0).map(a => ({ id:String(a.id || uid()), mode:a.mode, min:Math.min(Math.round(num(a.min)), 1440), ts:num(a.ts) }));
  return o;
}
function cleanDaily(map){ const out = {}; if (map && typeof map === "object") for (const [k,v] of Object.entries(map)){ const d = DAY_RE.test(k) && cleanDay(v); if (d) out[k] = d; } return out; }
function cleanSettings(raw){
  raw = raw && typeof raw === "object" ? raw : {};
  const st = Object.assign(clone(DEFAULT_SETTINGS), raw);
  const cal = inRange((raw.targets||{}).cal, 800, 10000, 2200);
  const base = targetsFromSplit(cal, SPLITS[raw.split] ? raw.split : "balanced"), rt = raw.targets && typeof raw.targets === "object" ? raw.targets : {};
  st.targets = {}; for (const k of Object.keys(base)) st.targets[k] = num(rt[k]) > 0 ? num(rt[k]) : base[k];
  st.targets.cal = cal;
  const P = Object.assign(clone(DEFAULT_SETTINGS.profile), raw.profile && typeof raw.profile === "object" ? raw.profile : {});
  P.name = String(P.name || "").slice(0,40); P.sex = P.sex === "male" ? "male" : "female";
  P.age = inRange(P.age, 12, 100, 35); P.heightIn = inRange(P.heightIn, 40, 96, 66); P.weightLb = inRange(P.weightLb, 60, 700, 160);
  P.goalWeightLb = num(P.goalWeightLb) >= 60 ? num(P.goalWeightLb) : ""; P.restingHR = inRange(P.restingHR, 35, 120, 68);
  if (!["1.2","1.375","1.55","1.725","1.9"].includes(String(P.activity))) P.activity = "1.55";
  if (!["lose","slow","maintain","gain"].includes(P.goal)) P.goal = "lose";
  st.profile = P;
  st.split = typeof st.split === "string" ? st.split : "balanced";
  st.waterGoal = inRange(st.waterGoal, 250, 10000, 2500);
  st.goalDeficit = inRange(st.goalDeficit, -1500, 2000, 500);
  const toMin = t => { const [a,b] = t.split(":").map(Number); return a*60+b; };
  if (!TIME_RE.test(st.dayStart) || !TIME_RE.test(st.dayEnd) || toMin(st.dayEnd) - toMin(st.dayStart) < 120){ st.dayStart = "07:00"; st.dayEnd = "21:00"; }
  st.model = typeof st.model === "string" && st.model ? st.model : DEFAULT_SETTINGS.model;
  return st;
}
(function loadLocal(){
  try {
    const raw = JSON.parse(safeGet(LS_KEY) || "null");
    if (raw && typeof raw === "object"){ S.entries = cleanEntries(raw.entries); S.daily = cleanDaily(raw.daily); S.settings = cleanSettings(raw.settings); }
  } catch {}
  const v = safeGet("snapsnack.view"); if (VIEWS.includes(v)) S.view = v;
})();
const apiKey = { get: () => safeGet("snapsnack.apikey") || "", set: v => safeSet("snapsnack.apikey", v) };
function saveLocal(){ safeSet(LS_KEY, JSON.stringify({ entries:S.entries, daily:S.daily, settings:S.settings })); }

const remote = { col:null, ready:false };
function snapshotState(){ return clone({ entries:S.entries, daily:S.daily, settings:S.settings }); }
function syncDiff(before, after){
  saveLocal();
  if (!remote.col) return;
  const bm = new Map(before.entries.map(e=>[e.id, JSON.stringify(e)]));
  const am = new Map(after.entries.map(e=>[e.id, JSON.stringify(e)]));
  const jobs = [];
  for (const [id, js] of am) if (bm.get(id) !== js) jobs.push(remote.col.doc("e_"+id).set(JSON.parse(js)));
  for (const id of bm.keys()) if (!am.has(id)) jobs.push(remote.col.doc("e_"+id).delete());
  const days = new Set([...Object.keys(before.daily), ...Object.keys(after.daily)]);
  for (const d of days){
    const a = after.daily[d], b = before.daily[d];
    if (JSON.stringify(a) !== JSON.stringify(b)) jobs.push(a ? remote.col.doc("d_"+d).set(a) : remote.col.doc("d_"+d).delete());
  }
  if (JSON.stringify(before.settings) !== JSON.stringify(after.settings)) jobs.push(remote.col.doc("settings").set(after.settings));
  Promise.allSettled(jobs).then(rs => { if (rs.some(r=>r.status==="rejected") && !remote.warned){ remote.warned = true; toast("Couldn't sync a change. It's saved on this device."); } });
}
const undoStack = [];
function commit(label, fn, { undoable=true } = {}){
  const before = snapshotState();
  fn(); invalidate();
  const after = snapshotState();
  if (JSON.stringify(before) === JSON.stringify(after)) { render(); return false; }
  if (undoable){ undoStack.push({ label, state:before }); if (undoStack.length > 30) undoStack.shift(); }
  syncDiff(before, after);
  render();
  if (label) toast(label, undoable ? undo : null);
  return true;
}
function undo(){
  const u = undoStack.pop(); if (!u) { toast("Nothing to undo."); return; }
  const cur = snapshotState();
  S.entries = u.state.entries; S.daily = u.state.daily; S.settings = u.state.settings;
  syncDiff(cur, snapshotState()); render(); toast("Undid: " + u.label);
}

async function initRemote(){
  if (!window.claude || typeof window.claude.use !== "function") return;
  try {
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db || !user) return;
    const id = await user.id(); if (!id) return;
    const col = db.collection("data/users/" + id);
    let first = true;
    col.onSnapshot(snap => {
      try {
        const docs = (snap && Array.isArray(snap.docs)) ? snap.docs : [];
        const rawEntries = [], rawDaily = {}; let settings = null;
        for (const d of docs){
          let v = null; try { v = d.data(); } catch {}
          if (!v || typeof v !== "object" || typeof d.id !== "string") continue;
          if (d.id === "settings") settings = v;
          else if (d.id.startsWith("e_")) rawEntries.push(v);
          else if (d.id.startsWith("d_")) rawDaily[d.id.slice(2)] = v;
        }
        if (first){
          first = false; remote.col = col; remote.ready = true;
          if (!docs.length){ // first run on this account: move this device's log up
            if (S.entries.length || Object.keys(S.daily).length) syncDiff({ entries:[], daily:{}, settings:{} }, snapshotState());
            setAIStatus(); return;
          }
          const have = new Set(rawEntries.map(e => String(e.id)));
          const localOnly = S.entries.filter(e => !have.has(e.id)); // logged here before signing in: keep, upload
          for (const e of localOnly){ rawEntries.push(e); col.doc("e_" + e.id).set(e).catch(()=>{}); }
          if (!settings && S.settings) col.doc("settings").set(S.settings).catch(()=>{});
        }
        if (!docs.length) return;
        S.entries = cleanEntries(rawEntries); S.daily = cleanDaily(rawDaily);
        if (settings) S.settings = cleanSettings(settings);
        saveLocal(); render(); setAIStatus();
      } catch (err){ console.error(err); }
    }, () => { toast("Sync is unavailable. Your log stays on this device."); });
  } catch {}
}

/* ---------- AI ---------- */
const AI = { mode:"none", sample:null }; // "claude" (viewer), "api" (own key), "none"
const IN_VIEWER = !!(window.claude && typeof window.claude.use === "function"); // opened from a claude.ai link (no outside network: API keys can't work here)
async function initAI(){
  if (window.claude && typeof window.claude.use === "function"){
    try {
      const sample = await window.claude.use("sample");
      if (sample){
        const lim = await sample.limits().catch(()=>null);
        AI.sample = sample;
        AI.vision = !!(lim && lim.images);
        AI.mode = "claude";
      }
    } catch {}
  }
  if (AI.mode === "none" && apiKey.get() && !IN_VIEWER) AI.mode = "api";
  setAIStatus();
}
function setAIStatus(){
  const dot = $("#aidot"), t = $("#aitext");
  dot.className = "dot " + (AI.mode === "none" ? "off" : "on");
  t.textContent = AI.mode === "claude" ? (!AI.vision ? "Claude · no photo reading" : remote.ready ? "Claude · synced" : "Claude AI on")
               : AI.mode === "api" ? "Claude API key" : "Manual mode";
}
async function apiCall(content, maxTokens=1500){
  const r = await fetch("https://api.anthropic.com/v1/messages", {
    method:"POST",
    headers:{ "content-type":"application/json", "x-api-key":apiKey.get(), "anthropic-version":"2023-06-01", "anthropic-dangerous-direct-browser-access":"true" },
    body: JSON.stringify({ model:S.settings.model || DEFAULT_SETTINGS.model, max_tokens:maxTokens, messages:[{ role:"user", content }] }),
  });
  if (!r.ok){ let m = r.status + ""; try { m = (await r.json()).error.message; } catch {} throw { code:"api", message:"Claude API: " + m }; }
  const j = await r.json();
  return (j.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("");
}
function blobToBase64(blob){ return new Promise((res,rej)=>{ const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(",")[1]); fr.onerror = rej; fr.readAsDataURL(blob); }); }
async function aiJSON(prompt, { image=null, quick=false } = {}){
  if (AI.mode === "claude"){
    const opts = { modelTier: quick ? "quick" : "default", cache:false };
    if (image) opts.images = [image];
    return await AI.sample.json(prompt, opts);
  }

function findFood(q){

function loadImg(blob){ return new Promise((res,rej)=>{ const u = URL.createObjectURL(blob), im = new Image(); im.onload = () => { res(im); setTimeout(()=>URL.revokeObjectURL(u), 1000); }; im.onerror = rej; im.src = u; }); }
async function resizeImage(blob, max, q){
  const im = await loadImg(blob), sc = Math.min(1, max/Math.max(im.naturalWidth, im.naturalHeight));
  const c = document.createElement("canvas"); c.width = Math.round(im.naturalWidth*sc); c.height = Math.round(im.naturalHeight*sc);
  c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
  return await new Promise(r => c.toBlob(r, "image/jpeg", q));
}
async function thumbDataURL(blob){
  const im = await loadImg(blob), size = 360, c = document.createElement("canvas"); c.width = c.height = size;
  const sq = Math.min(im.naturalWidth, im.naturalHeight);
  c.getContext("2d").drawImage(im, (im.naturalWidth-sq)/2, (im.naturalHeight-sq)/2, sq, sq, 0, 0, size, size);

async function handlePhotos(files){
  for (const f of files){ if (f && f.type && f.type.startsWith("image/")) await analyzePhoto(f); }
}
async function analyzePhoto(file){
  const ts = Date.now();
  let photo = ""; try { photo = await thumbDataURL(file); } catch { toast("That file isn't a readable image."); return; }
  const pend = { id:uid(), ts, day:dayKey(ts), photo, items:[], title:"Reading your plate…", meal:mealFor(ts) };
  if (S.day !== pend.day) S.day = pend.day;
  if (S.view !== "today") setView("today");
  S.pending.push(pend); render();
  const finish = () => { S.pending = S.pending.filter(p=>p!==pend); };
  if (AI.mode === "none" || (AI.mode === "claude" && !AI.vision)){
    finish(); render();
    toast(aiErrorText({ code: AI.mode === "none" ? "no_ai" : "images_unavailable" }));
    openEditor({ ...pend, title:"Photo meal", items:[] }, true); return;
  }
  try {
    const res = await aiJSON(VISION_PROMPT, { image:file });
    const items = (Array.isArray(res && res.items) ? res.items : []).map(normItem).sort((a,b)=>b.cal-a.cal);
    finish();

    const tot = sumItems(items);
    const entry = { id:pend.id, ts, day:pend.day, photo, items, title:String(res.title||items.map(i=>i.name).slice(0,2).join(" & ")).slice(0,60), note:String(res.note||"").slice(0,200), meal:mealFor(ts, tot.cal) };
    commit(`Logged ${entry.title}: ${fmt(tot.cal)} kcal`, () => { S.entries.push(entry); });
  } catch (e){

  }
}

function applyActions(actions){
  let view = null, didUndo = false;
  const valid = (actions||[]).filter(a => a && a.type);
  if (valid.some(a=>a.type==="undo")) { undo(); didUndo = true; }
  const edits = valid.filter(a => !["undo","show"].includes(a.type));
  for (const a of valid) if (a.type === "show" && ["today","gallery","burn","progress","week","month","targets"].includes(a.view)) view = a.view;
  if (edits.length) commit("Voice edit applied", () => {
    for (const a of edits){
      const e = a.entry ? S.entries.find(x=>x.id===a.entry) : null;
      switch (a.type){
        case "add_items": {
          const items = (a.items||[]).map(normItem); if (!items.length) break;
          const ts = S.day === todayKey() ? Date.now() : parseKey(S.day).setHours(12);
          S.entries.push({ id:uid(), ts, day:S.day, title:String(a.title||items.map(i=>i.name).slice(0,2).join(" & ")).slice(0,60), items:items.sort((x,y)=>y.cal-x.cal), meal: MEALS.includes(a.meal) ? a.meal : mealFor(ts, sumItems(items).cal), photo:"" });
          break; }
        case "update_item": if (e && e.items[a.index]) e.items[a.index] = normItem(Object.assign({}, e.items[a.index], a.fields||{})); break;
        case "delete_item": if (e && e.items[a.index]) { e.items.splice(a.index,1); if (!e.items.length) S.entries = S.entries.filter(x=>x!==e); } break;
        case "delete_entry": if (e) S.entries = S.entries.filter(x=>x!==e); break;
        case "move_entry": if (e && MEALS.includes(a.meal)) e.meal = a.meal; break;
        case "set_target": if (a.key === "water") S.settings.waterGoal = num(a.value); else if (a.key in S.settings.targets) { S.settings.targets[a.key] = num(a.value); if (a.key !== "cal") S.settings.split = "custom"; } break;
        case "set_plan": if (SPLITS[a.plan]) { S.settings.split = a.plan; S.settings.targets = targetsFromSplit(S.settings.targets.cal, a.plan); } break;
        case "add_water": { const d = S.daily[S.day] = Object.assign({}, S.daily[S.day]); d.water = Math.max(0,(d.water||0)+num(a.ml)); break; }
        case "log_weight": if (num(a.lb) > 0) S.daily[todayKey()] = Object.assign({}, S.daily[todayKey()], { weight:r1(num(a.lb)) }); break;
        case "log_activity": { const m = num(a.hr) >= 30 ? modeForHR(num(a.hr)) : modeByKey(a.mode); const min = Math.round(num(a.minutes)); if (min > 0 && m.key !== "rest"){ const d = S.daily[S.day] = Object.assign({}, S.daily[S.day]); d.activities = [...(d.activities||[]), { id:uid(), mode:m.key, min, ts:Date.now() }]; } break; }
        case "set_profile": { const f = a.fields||{}, P = S.settings.profile = Object.assign({}, S.settings.profile);
          if (f.name) P.name = String(f.name).slice(0,40); for (const key of ["weightLb","goalWeightLb","restingHR","age","heightIn"]) if (num(f[key]) > 0) P[key] = num(f[key]); break; }
        case "set_deficit_goal": S.settings.goalDeficit = num(a.kcal); break;
      }
    }
  });
  if (view) setView(view);
  return edits.length || view || didUndo;
}
function localCommand(text){
  const t = text.toLowerCase().replace(/,(?=\d{3})/g,"").trim();
  let m;
  if (/^undo\b|undo (that|it)/.test(t)) { undo(); return true; }
  if ((m = t.match(/\b(show|open|go to|view)\b.*\b(today|day|gallery|photos?|pictures?|burn|activity|progress|metrics|week|weekly|month|monthly|targets?|settings|goals?)\b/))) { const v = m[2]; setView(/week/.test(v) ? "week" : /month/.test(v) ? "month" : /target|setting|goal/.test(v) ? "targets" : /gallery|photo|picture/.test(v) ? "gallery" : /burn|activity/.test(v) ? "burn" : /progress|metric/.test(v) ? "progress" : "today"); return true; }
  const keys = { calorie:"cal", calories:"cal", kcal:"cal", protein:"protein", carb:"carbs", carbs:"carbs", carbohydrates:"carbs", fat:"fat", fiber:"fiber", sugar:"sugar", sugars:"sugar", sodium:"sodium", salt:"sodium", "saturated fat":"sat_fat", "sat fat":"sat_fat" };
  if ((m = t.match(/(?:set|change|make|update)?\s*(?:my\s+)?(saturated fat|sat fat|calories?|kcal|protein|carbs?|carbohydrates|fat|fiber|sugars?|sodium|salt)\s*(?:target|goal|limit)?\s*(?:to|=|at|is)?\s*(\d+(?:\.\d+)?)/))) {
    const key = keys[m[1]] || keys[m[1].replace(/s$/,"")]; if (key){ commit(`${key === "cal" ? "Calorie" : m[1][0].toUpperCase()+m[1].slice(1)} target set to ${fmt(num(m[2]))}`, ()=>{ S.settings.targets[key] = num(m[2]); if (key!=="cal") S.settings.split = "custom"; }); return true; }
  }
  for (const [k,v] of Object.entries(SPLITS)) if (t.includes(k.replace("_"," ")) || (k==="keto" && /keto/.test(t))) { applySplit(k); return true; }
  if ((m = t.match(/(\d+(?:\.\d+)?)?\s*(ml|milliliters?|oz|ounces?|glass(?:es)?|cups?|bottles?)?\s*(?:of\s+)?water/)) && /water/.test(t)) {
    const n = m[1] ? num(m[1]) : 1, u = m[2] || "glass";
    const ml = /ml|milli/.test(u) ? n : /oz|ounce/.test(u) ? n*29.6 : /bottle/.test(u) ? n*500 : n*250;
    addWater(S.day, r0(ml)); return true;
  }
  if ((m = t.match(/\b(?:my name is|call me)\s+([a-z][a-z'-]*)/))) { const nm = m[1][0].toUpperCase() + m[1].slice(1); commit(`Hi ${nm}!`, ()=>{ S.settings.profile = Object.assign({}, S.settings.profile, { name:nm }); }); return true; }
  if ((m = t.match(/(\d+(?:\.\d+)?)\s*(min|mins|minutes|hours?|hrs?)\b/)) && /(walk|stroll|stretch|yoga|ball|catch|chore|clean|jog|run|ran|bike|biked|cycl|lift|weights|workout|worked out|exercise|hiit|sprint|interval|swim|think|study|studied|focus)/.test(t)) {
    const min = num(m[1]) * (/h/.test(m[2]) ? 60 : 1);
    const mode = /hiit|sprint|interval/.test(t) ? "w_high" : /\b(ran|run|running)\b|hard|intense|heavy/.test(t) ? "w_full" : /jog|bike|biked|cycl|swim|lift|weights|workout|worked out|exercise/.test(t) ? (/light|easy/.test(t) ? "w_light" : "w_mod")
      : /brisk/.test(t) ? "w_light" : /walk|stroll/.test(t) ? "walk" : /think|study|studied|focus/.test(t) ? "think" : "active";
    const bpm = t.match(/(\d+)\s*(?:bpm|beats)/);
    logActivity(bpm ? modeForHR(num(bpm[1])).key : mode, min); return true;
  }
  if ((m = t.match(/\bdeficit\b\D*(\d+)/))) { commit(`Deficit goal set to ${fmt(num(m[1]))} kcal`, ()=>{ S.settings.goalDeficit = num(m[1]); }); return true; }
  if ((m = t.match(/\b(?:weigh|weight)\b\D*(\d+(?:\.\d+)?)\s*(kg|kilos?|lb|lbs|pounds)?/))) { logWeight(num(m[1]), m[2]); return true; }
  if (/(delete|remove)\s+(the\s+)?last( meal| entry)?/.test(t)) { const es = entriesOn(S.day); const lastE = last(es); if (!lastE) { toast("No meals to remove on this day."); return true; } commit(`Deleted ${lastE.title||"meal"}`, ()=>{ S.entries = S.entries.filter(x=>x.id!==lastE.id); }); return true; }
  if ((m = t.match(/^(?:i\s+)?(?:add|ate|had|log|drank)\s+(.+)/))) {
    const words = { a:1, an:1, one:1, two:2, three:3, four:4, half:.5 };
    const parts = m[1].split(/\s*(?:,|\band\b|\bwith\b|&)\s*/).filter(Boolean), items = [];
    for (let p of parts){
      let q = 1; const mm = p.match(/^(\d+(?:\.\d+)?|a|an|one|two|three|four|half)\s+(?:of\s+)?(.+)/); if (mm){ q = words[mm[1]] ?? num(mm[1]); p = mm[2]; }
      const f = findFood(p); if (f){ if (q !== 1){ for (const k of NUTR) f[k] = r1(f[k]*q); f.portion = `${q} × ${f.portion}`; } items.push(f); }
    }
    if (items.length){ const ts = S.day === todayKey() ? Date.now() : parseKey(S.day).setHours(12);
      commit(`Logged ${items.map(i=>i.name).join(", ")}`, ()=>{ S.entries.push({ id:uid(), ts, day:S.day, title:items.map(i=>i.name).slice(0,2).join(" & "), items, meal:mealFor(ts, sumItems(items).cal), photo:"" }); }); return true; }
  }
  return false;
}
async function runCommand(text){
  text = text.trim(); if (!text) return;
  const heard = $("#heard"); heard.hidden = false; heard.textContent = `“${text}”`;
  if (AI.mode === "none"){
    if (!localCommand(text)) toast("I didn't catch a command. Try “set protein to 150” or “add a banana”. Connect AI in Targets for free-form edits.");
    setTimeout(()=>{ heard.hidden = true; }, 4000); return;
  }
  // quick deterministic commands skip the round-trip
  if (/^(undo|show|open|go to)\b/i.test(text) && localCommand(text)) { heard.hidden = true; return; }
  heard.textContent = `“${text}” · working on it…`;
  try {
    const r = await aiJSON(commandPrompt(text), { quick:true });
    const changed = applyActions(r && r.actions);
    if (r && r.reply && (!changed || (r.actions||[]).some(a=>a.type!=="undo"))) toast(String(r.reply).slice(0,200), changed ? undo : null);
  } catch (e){
    if (!localCommand(text)) toast(aiErrorText(e));
  }
  setTimeout(()=>{ heard.hidden = true; }, 2500);
}

/* mic: Claude dictation in the viewer, Web Speech API elsewhere */
const mic = $("#mic");
let dict = null, rec = null, listening = false;
function micState(on){ listening = on; mic.classList.toggle("live", on); mic.setAttribute("aria-label", on ? "Stop listening" : "Speak a command"); }
async function initVoice(){
  if (window.claude && typeof window.claude.use === "function"){
    try { dict = await window.claude.use("dictation"); } catch { dict = null; }
  }
  if (dict){
    mic.hidden = false;
    let buf = "";
    dict.onPartial(({ text }) => { $("#cmd").value = (buf + " " + text).trim(); });
    dict.onFinal(({ text }) => { buf = (buf + " " + text).trim(); $("#cmd").value = buf; });
    dict.onState(({ state }) => {
      if (state === "listening") { buf = ""; micState(true); }
      else if (state === "idle") { micState(false); const v = $("#cmd").value; if (v.trim()) { $("#cmd").value = ""; runCommand(v); } }
    });
    return;
  }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (SR){
    mic.hidden = false;
    rec = new SR(); rec.lang = navigator.language || "en-US"; rec.interimResults = true; rec.continuous = false;
    rec.onresult = ev => { const r = Array.from(ev.results).map(x=>x[0].transcript).join(" "); $("#cmd").value = r; };
    rec.onend = () => { micState(false); const v = $("#cmd").value; if (v.trim()) { $("#cmd").value = ""; runCommand(v); } };
    rec.onerror = ev => { micState(false); if (ev.error === "not-allowed") { toast("Microphone access is off. You can type commands instead."); mic.hidden = true; } };
  }
}
mic.addEventListener("click", () => {
  if (dict){
    if (listening) { dict.stop().catch(()=>{}); return; }
    dict.start().catch(e => { micState(false); if (e && e.code === "not_granted") { mic.hidden = true; toast("Voice is off. You can type commands instead."); } });
    return;
  }
  if (rec){ if (listening) rec.stop(); else { $("#cmd").value = ""; try { rec.start(); micState(true); } catch {} } }
});
$("#cmdform").addEventListener("submit", ev => { ev.preventDefault(); const v = $("#cmd").value; $("#cmd").value = ""; runCommand(v); });

/* ---------- toast ---------- */
let toastTimer = 0;
function toast(msg, action){
  const t = $("#toast"); t.replaceChildren(h("span",null,msg)); if (action) t.append(h("button",{ onclick:()=>{ t.hidden = true; action(); } }, "Undo"));
  t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(()=>{ t.hidden = true; }, action ? 6000 : 4200);
}

/* ---------- wiring ---------- */
for (const b of document.querySelectorAll(".tabs button")) b.addEventListener("click", () => { if (b.dataset.view !== "today" && S.view === "today") {} setView(b.dataset.view); });
$("#snapbtn").addEventListener("click", () => $("#cam").click());
$("#galbtn").addEventListener("click", () => $("#gallery").click());
for (const id of ["#cam","#gallery"]) $(id).addEventListener("change", ev => { const fs = Array.from(ev.target.files||[]); ev.target.value = ""; handlePhotos(fs); });
document.addEventListener("dragover", ev => { if (ev.dataTransfer && Array.from(ev.dataTransfer.items||[]).some(i=>i.kind==="file")) ev.preventDefault(); });
document.addEventListener("drop", ev => { const fs = Array.from((ev.dataTransfer||{}).files||[]); if (fs.length){ ev.preventDefault(); handlePhotos(fs); } });
document.addEventListener("paste", ev => { const fs = Array.from((ev.clipboardData||{}).files||[]).filter(f=>f.type.startsWith("image/")); if (fs.length) handlePhotos(fs); });
document.addEventListener("keydown", ev => { if (ev.key === "Escape" && !$("#scrim").hidden) { $("#scrim").hidden = true; $("#scrim").replaceChildren(); } });
// redraw charts on theme change
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", () => render());
new MutationObserver(() => render()).observe(document.documentElement, { attributes:true, attributeFilter:["data-theme"] });
// real-time: roll the clock, pace line and day boundary every minute
let lastDay = todayKey();
setInterval(() => {
  const k = todayKey(); if (k !== lastDay){ if (S.day === lastDay) S.day = k; lastDay = k; }
  const busy = ["INPUT","SELECT","TEXTAREA"].includes(document.activeElement && document.activeElement.tagName);
  if (document.hidden || busy || !$("#scrim").hidden || !["today","burn","progress"].includes(S.view)) return;
  const y = window.scrollY; quietRender = true; render(); quietRender = false; window.scrollTo(0, y);
}, 60000);

render();
Promise.resolve().then(initAI).catch(e=>{ console.error(e); setAIStatus(); });
Promise.resolve().then(initVoice).catch(e=>console.error(e));
Promise.resolve().then(initRemote).catch(e=>console.error(e));
setTimeout(() => { if (!$("#main").children.length) showFatal(new Error("The app did not finish starting.")); }, 4000);
})();
</script>
