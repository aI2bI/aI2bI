<div id="installbar" class="toast" style="bottom:calc(150px + env(safe-area-inset-bottom,0px))" hidden>
  <span id="installtext">Install Snap Snack on your home screen</span>
  <button type="button" id="installgo">Install</button>
  <button type="button" id="installno" aria-label="Dismiss">✕</button>
</div>
<script>
/* Hosted build only: offline support + "add to home screen" prompt. */
(() => {
  const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
  if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register("sw.js").catch(() => {});
  if (standalone) return;
  const bar = document.getElementById("installbar"), go = document.getElementById("installgo");
  let seen = null; try { seen = localStorage.getItem("snapsnack.installtip"); } catch {}
  const hide = () => { bar.hidden = true; try { localStorage.setItem("snapsnack.installtip", "1"); } catch {} };
  document.getElementById("installno").onclick = hide;
  let deferred = null;
  addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferred = e; if (!seen) bar.hidden = false; }); // Android / desktop Chrome
  go.onclick = async () => { if (!deferred) return hide(); deferred.prompt(); try { await deferred.userChoice; } catch {} deferred = null; hide(); };
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  if (ios && !seen){ // iOS has no install prompt: show the steps instead
    document.getElementById("installtext").textContent = "Install: tap Share ⬆︎ then “Add to Home Screen”";
    go.textContent = "Got it"; setTimeout(() => { bar.hidden = false; }, 1500);
  }
})();
</script>
